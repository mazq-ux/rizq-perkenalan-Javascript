<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sederhana</title> <!--judul website-->
    <style> 
        body{
            font-family: arial,sans-serif;
            margin:o ;
            background: #f4f4f4;   
        }

        header{
            background: #333;
            color: white;
             padding: 15px;
             text-align: center;
        }

        nav{
            background: #555;
            padding: 10px;
            text-align: center;
        }

        nav a{
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover{
            text-decoration: underline;
        }

        main{
            padding: 20px;
        }

        section{
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        footer{
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        button{
            padding: 10px 15px;
            background: #28a742;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header> <!--bagian atas-->
        <h1>Website Satu File</h1> <!--judul paling paling besar-->
        <p>HTML + CSS + JavaScript satu file</p> <!--paragraf-->
    </header>

    <nav> <!--bagiann menu-->
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="contact">contact</a>
    </nav>

    <main>
        <section id="home"> <!--membagi halaman-->
            <h2>Home</h2>
            <p>ini adalah halaman utama website sederhana</p><!--paragraf-->
            <button onclick="tampilkanPesan()">klik saya</button> <!--bagian tombol yang di klik -->
        </section>

        <section id="about"> <!--membagi halaman-->
            <h2>about</h2>
            <p>Website ini dibuat dalama satu file meggunakan HTML, CSS, Javascript</p> <!--paragraf-->
        </section>

        <section id="content"> <!--membagi halaman-->
            <h2>Contact</h2><!--juduk denagn kata besar dibawah h1-->
            <form onsubmit="KirimFrom(event)">
                <label>Nama</label><br> <!--keteranga nama-->
                <input type="text" id="nama"required><br><br> <!--pindah baris-->

                <label>Email</label><br>
                <Input type="email" required><br><br><!--pindah baris-->
                    <button type="submit">Kirim</button> <!--tombol-->
            </form>
        </section>
    </main>
    <footer> <!--copyriting ss-->
        <p>&copy; 2026 website sederhana</p> <!--paragraf-->
    </footer>
    <script>
        function tampilkanPesan(){
            alert("Halo! ini JavaScript dalam satu file")
        }

        function KirimFrom(event){
            event.preventDefault();
            const nama = document.getElementById("nama").value;
            alert("Terima kasih,"+nama+"!pesan Anda terkirim")
        }
    </script>

</body>
</html>
